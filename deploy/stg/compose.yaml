# Staging: Traefik in front of the API. The database is Neon and migrations
# run from CI before each deploy, so neither is part of this stack.
#
# Reads .env next to this file: the app secrets plus API_HOST and ACME_EMAIL.
# IMAGE_TAG and DOCKER_GID are set by the deploy job.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    logging: *logging
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=traefik
      - -allowGET=/v1\..{1,2}/(version|containers/.*|events.*)
      - -allowHEAD=/_ping
      - -shutdowngracetime=5
      - -watchdoginterval=600
      - -stoponwatchdog
    read_only: true
    mem_limit: 64M
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65534:${DOCKER_GID:?DOCKER_GID is required}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    logging: *logging
    depends_on: [socket-proxy]
    command:
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=uniezz-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
    networks: [proxy, docker-api]

  api:
    image: ghcr.io/uniezz/uniezz-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    # The app drains for 5s, then waits up to 15s for requests; Docker's default 10s would cut it off.
    stop_grace_period: 30s
    # No ports: the API must be reachable through Traefik only, or anyone could forge X-Real-IP.
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_HOST:?API_HOST is required}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=8080
      - traefik.http.services.api.loadbalancer.healthcheck.path=/healthz/live
      - traefik.http.services.api.loadbalancer.healthcheck.interval=10s

networks:
  proxy:
    name: uniezz-proxy
  docker-api:
    internal: true

volumes:
  letsencrypt:
