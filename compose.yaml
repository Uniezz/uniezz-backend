# Local development stack, started by `mise run dev`. Staging uses deploy/stg/compose.yaml.
#
# Order: postgres (healthy) -> migrate (goose up, must exit 0) -> api.
# Secrets come from the shell environment (Doppler) or from .env, which Compose reads itself.

x-dev-image: &dev-image
  build:
    context: .
    dockerfile: Dockerfile.dev

# The containers reach PostgreSQL by its service name, not localhost.
x-database-url: &database-url postgres://postgres:postgrespassword@postgres:5432/app_dev?sslmode=disable

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: "http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000"
    entrypoint: ["mc"]
    command:
      - mb
      - --ignore-existing
      - local/uniezz-media
    restart: on-failure
  postgres:
    image: postgres:17-alpine
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: app_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    <<: *dev-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: *database-url
      GOOSE_MIGRATION_DIR: /src/migrations
    volumes:
      - ./migrations:/src/migrations:ro
    command: ["goose", "up"]

  api:
    <<: *dev-image
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    # Build to a binary and exec it, so the API is PID 1 and receives SIGTERM for its graceful shutdown.
    # -buildvcs=false: the image has no git to stamp VCS info from the mounted .git.
    command: ["sh", "-c", "go build -buildvcs=false -o /tmp/api ./cmd/api && exec /tmp/api"]
    environment:
      DATABASE_URL: *database-url
      PORT: "8080"
      ENV: development
      # Empty values fall back to the defaults in internal/config.
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      APP_WEB_URL: ${APP_WEB_URL:-}
      APP_MOBILE_SCHEME: ${APP_MOBILE_SCHEME:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UMCS_USOS_CONSUMER_KEY: ${UMCS_USOS_CONSUMER_KEY:-}
      UMCS_USOS_CONSUMER_SECRET: ${UMCS_USOS_CONSUMER_SECRET:-}
      UMLUB_USOS_CONSUMER_KEY: ${UMLUB_USOS_CONSUMER_KEY:-}
      UMLUB_USOS_CONSUMER_SECRET: ${UMLUB_USOS_CONSUMER_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      OTP_EMAIL_TEMPLATE_ID: ${OTP_EMAIL_TEMPLATE_ID:-}
      OTP_HASH_KEY: ${OTP_HASH_KEY:-}
      OTP_TEST_EMAILS: ${OTP_TEST_EMAILS:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-uniezz-media}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_ENDPOINT: http://minio:9000
      AWS_PUBLIC_ENDPOINT: ${AWS_PUBLIC_ENDPOINT:-http://localhost:9000}
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_PUBLIC_MEDIA_URL: ${AWS_PUBLIC_MEDIA_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - .:/src:ro
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    # The app drains for 5s, then waits up to 15s for requests; Docker's default 10s would cut it off.
    stop_grace_period: 30s
    # `docker compose up --watch` restarts the container on source changes; the command rebuilds from the cache.
    develop:
      watch:
        - action: restart
          path: ./cmd
          ignore: ["**/*_test.go"]
        - action: restart
          path: ./internal
          ignore: ["**/*_test.go"]
        - action: restart
          path: ./go.mod
        - action: restart
          path: ./go.sum


volumes:
  miniodata:
  pgdata:
  gomod:
  gobuild:
