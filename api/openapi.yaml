  /feed/posts:
    get:
      description: Newest first by createdAt, then ID descending. All signed-in students can browse posts across universities. Keep the same search and filters when following a cursor; results reflect current data.
      operationId: listFeedPosts
      parameters:
        - description: nextCursor from the previous page; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: nextCursor from the previous page; omit for the first page
            maxLength: 512
            type: string
        - description: Maximum number of items in the page
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Maximum number of items in the page
            format: int64
            maximum: 50
            minimum: 1
            type: integer
        - description: Up to 5 words of at least 3 characters. Every word must match the title, content, author name or target university ID or name, ignoring case and accents; blank means no search
          explode: false
          in: query
          name: q
          schema:
            description: Up to 5 words of at least 3 characters. Every word must match the title, content, author name or target university ID or name, ignoring case and accents; blank means no search
            examples:
              - sesja umcs
            maxLength: 200
            type: string
        - description: Only posts by this user
          explode: false
          in: query
          name: authorId
          schema:
            description: Only posts by this user
            format: uuid
            type: string
        - description: Posts targeted to this university or to all; all alone returns only posts targeted to everyone
          explode: false
          in: query
          name: university
          schema:
            description: Posts targeted to this university or to all; all alone returns only posts targeted to everyone
            examples:
              - umcs
            maxLength: 32
            type: string
        - explode: false
          in: query
          name: type
          schema:
            enum:
              - announcement
              - event
              - question
            type: string
        - description: Created at or after this time
          explode: false
          in: query
          name: from
          schema:
            description: Created at or after this time
            format: date-time
            type: string
        - description: Created before this time
          explode: false
          in: query
          name: to
          schema:
            description: Created before this time
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPostsOutputBody"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List feed posts
      tags:
        - feed
    post:
      operationId: createFeedPost
      parameters:
        - description: Repeating a request with the same key returns the resource the first one created instead of creating another. Keys are kept for at least 24 hours.
          in: header
          name: Idempotency-Key
          schema:
            description: Repeating a request with the same key returns the resource the first one created instead of creating another. Keys are kept for at least 24 hours.
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
