  /feed/posts/{id}/navigation:
    get:
      description: Uses the regular feed visibility and createdAt/ID descending order. Pass the active feed q, authorId, university, type, from and to filters; omit them to navigate the whole feed. Returns 404 if the current post is deleted, inaccessible, or outside these filters. Both IDs are null for a single matching post.
      operationId: getFeedPostNavigation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
        - description: Up to 5 words of at least 3 characters. Every word must match the title, content, author name or target university ID or name, ignoring case and accents; blank means no search
          explode: false
          in: query
          name: q
          schema:
            description: Up to 5 words of at least 3 characters. Every word must match the title, content, author name or target university ID or name, ignoring case and accents; blank means no search
            examples:
              - sesja umcs
            maxLength: 200
            type: string
        - description: Only posts by this user
          explode: false
          in: query
          name: authorId
          schema:
            description: Only posts by this user
            format: uuid
            type: string
        - description: Posts targeted to this university or to all; all alone returns only posts targeted to everyone
          explode: false
          in: query
          name: university
          schema:
            description: Posts targeted to this university or to all; all alone returns only posts targeted to everyone
            examples:
              - umcs
            maxLength: 32
            type: string
        - explode: false
          in: query
          name: type
          schema:
            enum:
              - announcement
              - event
              - question
            type: string
        - description: Created at or after this time
          explode: false
          in: query
          name: from
          schema:
            description: Created at or after this time
            format: date-time
            type: string
        - description: Created before this time
          explode: false
          in: query
          name: to
          schema:
            description: Created before this time
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostNavigation"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Get previous and next feed post IDs
      tags:
        - feed
