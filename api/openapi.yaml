components:
  schemas:
    ErrorBody:
      additionalProperties: false
      properties:
        error:
          description: Machine-readable error code
          examples:
            - invalid_input
          type: string
      required:
        - error
      type: object
    ExchangeInputBody:
      additionalProperties: false
      properties:
        code:
          description: One-time login code from the auth redirect
          maxLength: 64
          minLength: 1
          type: string
      required:
        - code
      type: object
    FacultyDTO:
      additionalProperties: false
      properties:
        address:
          description: Street address of the faculty building
          examples:
            - pl. Marii Curie-Skłodowskiej 2
          type: string
        location:
          $ref: "#/components/schemas/GeoPointDTO"
          description: Geographic location of the faculty building
        name:
          description: Display name of the faculty
          examples:
            - Wydział Chemii
          type: string
      required:
        - name
        - address
        - location
      type: object
    GeoPointDTO:
      additionalProperties: false
      properties:
        latitude:
          description: Latitude in decimal degrees (WGS 84)
          examples:
            - 51.24513
          format: double
          type: number
        longitude:
          description: Longitude in decimal degrees (WGS 84)
          examples:
            - 22.54247
          format: double
          type: number
      required:
        - latitude
        - longitude
      type: object
    IssuedSession:
      additionalProperties: false
      properties:
        expiresAt:
          description: timestamp when the session expires
          format: date-time
          type: string
        token:
          description: token to be used in Authorization header for subsequent requests
          type: string
      required:
        - token
        - expiresAt
      type: object
    OtpRequestInputBody:
      additionalProperties: false
      properties:
        email:
          description: University email address
          examples:
            - jan.kowalski@student.kul.pl
          maxLength: 255
          minLength: 3
          type: string
        university:
          description: University to log in to
          examples:
            - kul
          minLength: 1
          type: string
      required:
        - university
        - email
      type: object
    OtpVerifyInputBody:
      additionalProperties: false
      properties:
        code:
          description: Code from the email
          examples:
            - "123456"
          pattern: ^[0-9]{6}$
          type: string
        email:
          description: Email the code was sent to
          examples:
            - jan.kowalski@student.kul.pl
          maxLength: 255
          minLength: 3
          type: string
        university:
          description: University to log in to
          examples:
            - kul
          minLength: 1
          type: string
      required:
        - university
        - email
        - code
      type: object
    UniversityDTO:
      additionalProperties: false
      properties:
        authMethod:
          description: Authentication method used by the university
          examples:
            - USOS
          type: string
        domains:
          description: Allowed student email domains for OTP authentication
          examples:
            - - student.kul.pl
          items:
            type: string
          type:
            - array
            - "null"
        faculties:
          description: Faculties of the university with their locations
          items:
            $ref: "#/components/schemas/FacultyDTO"
          type:
            - array
            - "null"
        id:
          description: Unique identifier of the university
          examples:
            - umcs
          type: string
        name:
          description: Display name of the university
          examples:
            - Uniwersytet Marii Curie-Skłodowskiej
          type: string
      required:
        - id
        - name
        - authMethod
        - faculties
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  title: Uniezz API
  version: dev
openapi: 3.1.0
paths:
  /auth/exchange:
    post:
      operationId: exchangeLoginCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSession"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Exchange a one-time login code for a session
      tags:
        - auth
  /auth/otp/request:
    post:
      description: Sends a 6-digit code to the university email. The code is valid for 10 minutes and a new request replaces the previous code.
      operationId: requestOtpCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInputBody"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Gateway
      summary: Email a one-time login code
      tags:
        - auth
  /auth/otp/verify:
    post:
      description: Returns a session. A code allows 5 attempts; after that, or after it expires, request a new one.
      operationId: verifyOtpCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSession"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Log in with an emailed code
      tags:
        - auth
  /auth/universities:
    get:
      description: Lists every university the app supports, in display order, with how its students log in.
      operationId: getUniversities
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UniversityDTO"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Get the list of supported universities
      tags:
        - auth
  /auth/usos/callback:
    get:
      description: Called by USOS, not by the apps. Redirects to the app with ?code=<login code> to pass to exchangeLoginCode, or with ?error=<code>. Answers with a JSON error only when the login state is unknown, as there is no app to return to.
      operationId: finishUsosLogin
      parameters:
        - description: Request token, set by USOS
          explode: false
          in: query
          name: oauth_token
          required: true
          schema:
            description: Request token, set by USOS
            minLength: 1
            type: string
        - description: Verifier, set by USOS
          explode: false
          in: query
          name: oauth_verifier
          required: true
          schema:
            description: Verifier, set by USOS
            minLength: 1
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Finish a USOS login
      tags:
        - auth
  /auth/usos/start:
    get:
      description: Redirects to the university's USOS authorization page. Errors after the platform is known are sent to the app as a redirect with ?error=<code>.
      operationId: startUsosLogin
      parameters:
        - description: University to log in to
          explode: false
          in: query
          name: university
          required: true
          schema:
            description: University to log in to
            examples:
              - umcs
            type: string
        - description: App to send the browser back to when the login is done
          explode: false
          in: query
          name: platform
          required: true
          schema:
            description: App to send the browser back to when the login is done
            enum:
              - web
              - mobile
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Start a USOS login
      tags:
        - auth
