components:
  schemas:
    CreateUploadInputBody:
      additionalProperties: false
      properties:
        contentType:
          description: MIME type the file will be uploaded with
          enum:
            - image/jpeg
            - image/png
            - image/webp
          type: string
        kind:
          description: What the file will be used for
          enum:
            - avatar
            - feed
            - chat
          type: string
        size:
          description: Exact file size in bytes; 5 MiB max for avatars, 10 MiB for feed and chat
          format: int64
          minimum: 1
          type: integer
      required:
        - kind
        - contentType
        - size
      type: object
    ErrorBody:
      additionalProperties: false
      properties:
        error:
          description: Machine-readable error code
          examples:
            - invalid_input
          type: string
      required:
        - error
      type: object
    ExchangeInputBody:
      additionalProperties: false
      properties:
        code:
          description: One-time login code from the auth redirect
          maxLength: 64
          minLength: 1
          type: string
      required:
        - code
      type: object
    FacultyDTO:
      additionalProperties: false
      properties:
        address:
          description: Street address of the faculty building
          examples:
            - pl. Marii Curie-Skłodowskiej 2
          type: string
        location:
          $ref: "#/components/schemas/GeoPointDTO"
          description: Geographic location of the faculty building
        name:
          description: Display name of the faculty
          examples:
            - Wydział Chemii
          type: string
      required:
        - name
        - address
        - location
      type: object
    GeoPointDTO:
      additionalProperties: false
      properties:
        latitude:
          description: Latitude in decimal degrees (WGS 84)
          examples:
            - 51.24513
          format: double
          type: number
        longitude:
          description: Longitude in decimal degrees (WGS 84)
          examples:
            - 22.54247
          format: double
          type: number
      required:
        - latitude
        - longitude
      type: object
    IssuedSession:
      additionalProperties: false
      properties:
        expiresAt:
          description: timestamp when the session expires
          format: date-time
          type: string
        token:
          description: token to be used in Authorization header for subsequent requests
          type: string
      required:
        - token
        - expiresAt
      type: object
    ListProfilesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ProfileSummary"
          type:
            - array
            - "null"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
      type: object
    ListProgrammesOutputBody:
      additionalProperties: false
      properties:
        programmes:
          items:
            $ref: "#/components/schemas/Programme"
          type:
            - array
            - "null"
      required:
        - programmes
      type: object
    OtpRequestInputBody:
      additionalProperties: false
      properties:
        email:
          description: University email address
          examples:
            - jan.kowalski@student.kul.pl
          maxLength: 255
          minLength: 3
          type: string
        university:
          description: University to log in to
          examples:
            - kul
          minLength: 1
          type: string
      required:
        - university
        - email
      type: object
    OtpVerifyInputBody:
      additionalProperties: false
      properties:
        code:
          description: Code from the email
          examples:
            - "123456"
          pattern: ^[0-9]{6}$
          type: string
        email:
          description: Email the code was sent to
          examples:
            - jan.kowalski@student.kul.pl
          maxLength: 255
          minLength: 3
          type: string
        university:
          description: University to log in to
          examples:
            - kul
          minLength: 1
          type: string
      required:
        - university
        - email
        - code
      type: object
    Profile:
      additionalProperties: false
      properties:
        avatarUrl:
          description: URL of the avatar image, null when the student has none
          type:
            - string
            - "null"
        bio:
          description: Plain text, up to 500 characters
          examples:
            - Second-year CS student, into climbing.
          type:
            - string
            - "null"
        createdAt:
          format: date-time
          type: string
        email:
          description: University email, null when USOS did not share it
          examples:
            - jan.kowalski@umcs.pl
          type:
            - string
            - "null"
        firstName:
          examples:
            - Jan
          type:
            - string
            - "null"
        id:
          description: User ID
          format: uuid
          type: string
        interests:
          description: Up to 10 tags
          examples:
            - - climbing
              - go
          items:
            type: string
          type:
            - array
            - "null"
        lastName:
          examples:
            - Kowalski
          type:
            - string
            - "null"
        privacy:
          additionalProperties: false
          description: Which profile fields other students see. A missing setting keeps its current value.
          properties:
            showEmail:
              default: false
              description: Show the university email to other students
              type: boolean
            showFaculty:
              default: true
              description: Show the faculty of each study programme
              type: boolean
            showYear:
              default: true
              description: Show the year of study of each study programme
              type: boolean
          type: object
        programmes:
          description: Study programmes, primary first; empty when the student has none
          items:
            $ref: "#/components/schemas/Programme"
          type:
            - array
            - "null"
        universityId:
          examples:
            - umcs
          type: string
      required:
        - id
        - email
        - firstName
        - lastName
        - universityId
        - programmes
        - avatarUrl
        - bio
        - interests
        - privacy
        - createdAt
      type: object
    ProfileSummary:
      additionalProperties: false
      properties:
        avatarUrl:
          type:
            - string
            - "null"
        firstName:
          examples:
            - Jan
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        lastName:
          examples:
            - Kowalski
          type:
            - string
            - "null"
        universityId:
          examples:
            - umcs
          type: string
      required:
        - id
        - firstName
        - lastName
        - universityId
        - avatarUrl
      type: object
    Programme:
      additionalProperties: false
      properties:
        faculty:
          examples:
            - Wydział Matematyki, Fizyki i Informatyki
          type: string
        id:
          format: uuid
          type: string
        isPrimary:
          type: boolean
        level:
          enum:
            - first_cycle
            - second_cycle
            - long_cycle
            - third_cycle
            - phd_school
          type:
            - string
            - "null"
        modeOfStudies:
          enum:
            - full_time
            - part_time
          type:
            - string
            - "null"
        programme:
          examples:
            - Informatyka
          type: string
        status:
          enum:
            - active
            - graduated
            - suspended
            - cancelled
          type: string
        yearOfStudy:
          examples:
            - 2
          format: int64
          maximum: 6
          minimum: 1
          type:
            - integer
            - "null"
      required:
        - id
        - faculty
        - programme
        - level
        - modeOfStudies
        - yearOfStudy
        - status
        - isPrimary
      type: object
    ProgrammeRequest:
      additionalProperties: false
      properties:
        faculty:
          maxLength: 255
          minLength: 1
          type: string
        isPrimary:
          description: Making a programme primary clears the flag on the others
          type: boolean
        level:
          enum:
            - first_cycle
            - second_cycle
            - long_cycle
            - third_cycle
            - phd_school
          type: string
        modeOfStudies:
          enum:
            - full_time
            - part_time
          type: string
        programme:
          maxLength: 255
          minLength: 1
          type: string
        status:
          default: active
          enum:
            - active
            - graduated
            - suspended
            - cancelled
          type: string
        yearOfStudy:
          format: int64
          maximum: 6
          minimum: 1
          type: integer
      required:
        - faculty
        - programme
      type: object
    PublicProfile:
      additionalProperties: false
      properties:
        avatarUrl:
          type:
            - string
            - "null"
        bio:
          type:
            - string
            - "null"
        email:
          description: Null unless the student shows it
          type:
            - string
            - "null"
        firstName:
          examples:
            - Jan
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        interests:
          items:
            type: string
          type:
            - array
            - "null"
        lastName:
          examples:
            - Kowalski
          type:
            - string
            - "null"
        programmes:
          description: Primary first
          items:
            $ref: "#/components/schemas/PublicProgramme"
          type:
            - array
            - "null"
        universityId:
          examples:
            - umcs
          type: string
      required:
        - id
        - email
        - firstName
        - lastName
        - universityId
        - avatarUrl
        - bio
        - interests
        - programmes
      type: object
    PublicProgramme:
      additionalProperties: false
      properties:
        faculty:
          description: Null when the student hides it
          type:
            - string
            - "null"
        isPrimary:
          type: boolean
        level:
          enum:
            - first_cycle
            - second_cycle
            - long_cycle
            - third_cycle
            - phd_school
          type:
            - string
            - "null"
        modeOfStudies:
          enum:
            - full_time
            - part_time
          type:
            - string
            - "null"
        programme:
          examples:
            - Informatyka
          type: string
        status:
          enum:
            - active
            - graduated
            - suspended
            - cancelled
          type: string
        yearOfStudy:
          description: Null when unknown or hidden by the student
          format: int64
          type:
            - integer
            - "null"
      required:
        - faculty
        - programme
        - level
        - modeOfStudies
        - yearOfStudy
        - status
        - isPrimary
      type: object
    UniversityDTO:
      additionalProperties: false
      properties:
        authMethod:
          description: Authentication method used by the university
          examples:
            - USOS
          type: string
        domains:
          description: Allowed student email domains for OTP authentication
          examples:
            - - student.kul.pl
          items:
            type: string
          type:
            - array
            - "null"
        faculties:
          description: Faculties of the university with their locations
          items:
            $ref: "#/components/schemas/FacultyDTO"
          type:
            - array
            - "null"
        id:
          description: Unique identifier of the university
          examples:
            - umcs
          type: string
        name:
          description: Display name of the university
          examples:
            - Uniwersytet Marii Curie-Skłodowskiej
          type: string
      required:
        - id
        - name
        - authMethod
        - faculties
      type: object
    UpdateMeInputBody:
      additionalProperties: false
      properties:
        avatarMediaId:
          description: mediaId of an avatar uploaded through createMediaUpload; the previous avatar is deleted
          format: uuid
          type: string
        bio:
          description: Plain text; HTML is stripped and the result may be up to 500 characters. An empty string clears it.
          maxLength: 2000
          type: string
        firstName:
          maxLength: 100
          minLength: 1
          type: string
        interests:
          description: "Replaces all interests: up to 10 tags of up to 30 characters, duplicates ignored"
          items:
            type: string
          maxItems: 10
          type: array
        lastName:
          maxLength: 100
          minLength: 1
          type: string
        privacy:
          additionalProperties: false
          description: Which profile fields other students see. A missing setting keeps its current value.
          properties:
            showEmail:
              default: false
              description: Show the university email to other students
              type: boolean
            showFaculty:
              default: true
              description: Show the faculty of each study programme
              type: boolean
            showYear:
              default: true
              description: Show the year of study of each study programme
              type: boolean
          type: object
      type: object
    Upload:
      additionalProperties: false
      properties:
        expiresAt:
          description: When the upload URL stops working
          format: date-time
          type: string
        mediaId:
          description: ID to pass to the endpoint that uses the file, e.g. avatarMediaId
          format: uuid
          type: string
        uploadUrl:
          description: Presigned URL to PUT the file to, with the same Content-Type and Content-Length
          type: string
      required:
        - mediaId
        - uploadUrl
        - expiresAt
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  title: Uniezz API
  version: dev
openapi: 3.1.0
paths:
  /auth/exchange:
    post:
      operationId: exchangeLoginCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSession"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Exchange a one-time login code for a session
      tags:
        - auth
  /auth/otp/request:
    post:
      description: Sends a 6-digit code to the university email. The code is valid for 10 minutes and a new request replaces the previous code.
      operationId: requestOtpCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInputBody"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Gateway
      summary: Email a one-time login code
      tags:
        - auth
  /auth/otp/verify:
    post:
      description: Returns a session. A code allows 5 attempts; after that, or after it expires, request a new one.
      operationId: verifyOtpCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSession"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Log in with an emailed code
      tags:
        - auth
  /auth/universities:
    get:
      description: Lists every university the app supports, in display order, with how its students log in.
      operationId: getUniversities
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UniversityDTO"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Get the list of supported universities
      tags:
        - auth
  /auth/usos/callback:
    get:
      description: Called by USOS, not by the apps. Redirects to the app with ?code=<login code> to pass to exchangeLoginCode, or with ?error=<code>. Answers with a JSON error only when the login state is unknown, as there is no app to return to.
      operationId: finishUsosLogin
      parameters:
        - description: Request token, set by USOS
          explode: false
          in: query
          name: oauth_token
          required: true
          schema:
            description: Request token, set by USOS
            minLength: 1
            type: string
        - description: Verifier, set by USOS
          explode: false
          in: query
          name: oauth_verifier
          required: true
          schema:
            description: Verifier, set by USOS
            minLength: 1
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Finish a USOS login
      tags:
        - auth
  /auth/usos/start:
    get:
      description: Redirects to the university's USOS authorization page. Errors after the platform is known are sent to the app as a redirect with ?error=<code>.
      operationId: startUsosLogin
      parameters:
        - description: University to log in to
          explode: false
          in: query
          name: university
          required: true
          schema:
            description: University to log in to
            examples:
              - umcs
            type: string
        - description: App to send the browser back to when the login is done
          explode: false
          in: query
          name: platform
          required: true
          schema:
            description: App to send the browser back to when the login is done
            enum:
              - web
              - mobile
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Start a USOS login
      tags:
        - auth
  /media/uploads:
    post:
      description: Creates a pending media item owned by the caller and returns a presigned URL to upload the file to.
      operationId: createMediaUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Start a media upload
      tags:
        - media
  /profile/avatar:
    delete:
      description: Clears the avatar and deletes its file. Succeeds when there is no avatar.
      operationId: deleteMyAvatar
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Remove the logged-in student's avatar
      tags:
        - profile
  /profile/me:
    get:
      description: Same shape for every university and login method. Read from our database only.
      operationId: getMyProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Get the logged-in student's profile
      tags:
        - profile
    patch:
      description: Changes only the fields that are present. Returns the updated profile.
      operationId: updateMyProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Update the logged-in student's profile
      tags:
        - profile
  /profile/programmes:
    get:
      operationId: listMyProgrammes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProgrammesOutputBody"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List the logged-in student's study programmes
      tags:
        - profile
    post:
      operationId: createMyProgramme
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgrammeRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Add a study programme
      tags:
        - profile
  /profile/programmes/{id}:
    delete:
      operationId: deleteMyProgramme
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
