                $ref: "#/components/schemas/ErrorBody"
          description: Gone
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Create a feed post
      tags:
