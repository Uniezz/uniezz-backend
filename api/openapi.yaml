components:
  schemas:
    ActOnCandidateInputBody:
      additionalProperties: false
      properties:
        action:
          enum:
            - like
            - pass
          type: string
        mode:
          enum:
            - friends
            - studyBuddy
            - dating
          type: string
      required:
        - mode
        - action
      type: object
    ActionResult:
      additionalProperties: false
      properties:
        connection:
          $ref: "#/components/schemas/Connection"
          description: Present when this like created the match
        matched:
          type: boolean
      required:
        - matched
      type: object
    Author:
      additionalProperties: false
      properties:
        avatarUrl:
          type:
            - string
            - "null"
        firstName:
          examples:
            - Jan
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        lastName:
          examples:
            - Kowalski
          type:
            - string
            - "null"
        universityId:
          examples:
            - umcs
          type: string
      required:
        - id
        - firstName
        - lastName
        - universityId
        - avatarUrl
      type: object
    Card:
      additionalProperties: false
      properties:
        age:
          description: Null when the student has not set a birth date
          format: int64
          type:
            - integer
            - "null"
        bio:
          description: Null when the student has none
          type:
            - string
            - "null"
        candidateId:
          description: Opaque token, valid only for this viewer, for 30 days after it was first issued
          format: uuid
          type: string
        intent:
          description: Null when the student has none
          type:
            - string
            - "null"
        interests:
          items:
            type: string
          type:
            - array
            - "null"
        level:
          description: Of the primary programme; null when unknown
          enum:
            - first_cycle
            - second_cycle
            - long_cycle
            - third_cycle
            - phd_school
          type:
            - string
            - "null"
        sharedInterests:
          description: The interests the viewer also has
          items:
            type: string
          type:
            - array
            - "null"
        universityId:
          examples:
            - umcs
          type: string
      required:
        - candidateId
        - intent
        - bio
        - interests
        - sharedInterests
        - universityId
        - level
        - age
      type: object
    Comment:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/Author"
          description: Missing when deleted
        content:
          description: Null when deleted
          type:
            - string
            - "null"
        createdAt:
          format: date-time
          type: string
        deleted:
          description: A deleted comment is listed only while it still has replies
          type: boolean
        editedAt:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        likedByMe:
          type: boolean
        likesCount:
          format: int64
          type: integer
        parentId:
          description: Root comment of the thread; null for a root comment
          type:
            - string
            - "null"
        postId:
          format: uuid
          type: string
        repliesCount:
          format: int64
          type: integer
        replyToCommentId:
          description: Comment this reply answers; null for a root comment or when that comment was deleted
          type:
            - string
            - "null"
      required:
        - id
        - postId
        - parentId
        - replyToCommentId
        - content
        - deleted
        - likesCount
        - repliesCount
        - likedByMe
        - createdAt
        - editedAt
      type: object
    Connection:
      additionalProperties: false
      properties:
        connectedAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        mode:
          enum:
            - friends
            - studyBuddy
            - dating
          type: string
        profile:
          $ref: "#/components/schemas/ProfileSummary"
      required:
        - id
        - mode
        - connectedAt
        - profile
      type: object
    CreateCommentInputBody:
      additionalProperties: false
      properties:
        content:
          description: 1–1000 characters after HTML is stripped
          maxLength: 4000
          type: string
        replyToCommentId:
          description: Comment to reply to; a reply to a reply joins the same thread
          type: string
      required:
        - content
      type: object
    CreatePostInputBody:
      additionalProperties: false
      properties:
        content:
          description: 10–5000 characters after HTML is stripped
          maxLength: 20000
          type: string
        eventDate:
          description: Required for event posts, not allowed for others
          format: date-time
          type: string
        mediaIds:
          description: Uploads of kind feed, shown in this order
          items:
            type: string
          maxItems: 10
          type:
            - array
            - "null"
          uniqueItems: true
        tags:
          description: Up to 10 tags of up to 30 characters
          items:
            type: string
          maxItems: 20
          type:
            - array
            - "null"
        title:
          description: 3–150 characters after HTML is stripped
          maxLength: 600
          type: string
        type:
          enum:
            - announcement
            - event
            - question
          type: string
        university:
          description: Your own university, or all
          examples:
            - umcs
          maxLength: 32
          type: string
      required:
        - type
        - university
        - title
        - content
      type: object
    CreateReportInputBody:
      additionalProperties: false
      properties:
        details:
          description: Up to 1000 characters after HTML is stripped
          maxLength: 4000
          type: string
        reason:
          enum:
            - spam
            - harassment
            - inappropriate
            - hate_speech
            - other
          type: string
        targetId:
          format: uuid
          type: string
        targetType:
          enum:
            - post
            - comment
            - user
            - candidate
          type: string
      required:
        - targetType
        - targetId
        - reason
      type: object
    CreateUploadInputBody:
      additionalProperties: false
      properties:
        contentType:
          description: MIME type the file will be uploaded with
          enum:
            - image/jpeg
            - image/png
            - image/webp
          type: string
        kind:
          description: What the file will be used for
          enum:
            - avatar
            - banner
            - feed
            - chat
          type: string
        size:
          description: Exact file size in bytes; 5 MiB max for avatars, 10 MiB for banners, feed and chat
          format: int64
          minimum: 1
          type: integer
      required:
        - kind
        - contentType
        - size
      type: object
    DiscoverOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Card"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    Entry:
      additionalProperties: false
      properties:
        answer:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        question:
          type: string
        status:
          enum:
            - proposed
            - published
            - rejected
          type: string
      required:
        - id
        - question
        - answer
        - status
        - createdAt
      type: object
    ErrorBody:
      additionalProperties: false
      properties:
        error:
          description: Machine-readable error code
          examples:
            - invalid_input
          type: string
      required:
        - error
      type: object
    ExchangeInputBody:
      additionalProperties: false
      properties:
        code:
          description: One-time login code from the auth redirect
          maxLength: 64
          minLength: 1
          type: string
      required:
        - code
      type: object
    FacultyDTO:
      additionalProperties: false
      properties:
        address:
          description: Street address of the faculty building
          examples:
            - pl. Marii Curie-Skłodowskiej 2
          type: string
        location:
          $ref: "#/components/schemas/GeoPointDTO"
          description: Geographic location of the faculty building
        name:
          description: Display name of the faculty
          examples:
            - Wydział Chemii
          type: string
      required:
        - name
        - address
        - location
      type: object
    FeaturedPost:
      additionalProperties: false
      properties:
        eventDate:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        imageUrl:
          description: First available post image
          type: string
        title:
          type: string
        university:
          type: string
      required:
        - id
        - title
        - imageUrl
        - university
        - eventDate
      type: object
    FeaturedPostsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/FeaturedPost"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    GeoPointDTO:
      additionalProperties: false
      properties:
        latitude:
          description: Latitude in decimal degrees (WGS 84)
          examples:
            - 51.24513
          format: double
          type: number
        longitude:
          description: Longitude in decimal degrees (WGS 84)
          examples:
            - 22.54247
          format: double
          type: number
      required:
        - latitude
        - longitude
      type: object
    IssuedSession:
      additionalProperties: false
      properties:
        expiresAt:
          description: timestamp when the session expires
          format: date-time
          type: string
        token:
          description: token to be used in Authorization header for subsequent requests
          type: string
      required:
        - token
        - expiresAt
      type: object
    LikeState:
      additionalProperties: false
      properties:
        liked:
          type: boolean
        likesCount:
          format: int64
          type: integer
      required:
        - liked
        - likesCount
      type: object
    ListCommentsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Comment"
          type:
            - array
            - "null"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
      type: object
    ListConnectionsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Connection"
          type:
            - array
            - "null"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
      type: object
    ListEntriesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Entry"
          type:
            - array
            - "null"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
      type: object
    ListPostsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Post"
          type:
            - array
            - "null"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
      type: object
    ListProfilesOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ProfileSummary"
          type:
            - array
            - "null"
        nextCursor:
          description: Pass as cursor to get the next page; null on the last page
          type:
            - string
            - "null"
      required:
        - items
        - nextCursor
      type: object
    ListProgrammesOutputBody:
      additionalProperties: false
      properties:
        programmes:
          items:
            $ref: "#/components/schemas/Programme"
          type:
            - array
            - "null"
      required:
        - programmes
      type: object
    OtpRequestInputBody:
      additionalProperties: false
      properties:
        email:
          description: University email address
          examples:
            - jan.kowalski@student.kul.pl
          maxLength: 255
          minLength: 3
          type: string
        university:
          description: University to log in to
          examples:
            - kul
          minLength: 1
          type: string
      required:
        - university
        - email
      type: object
    OtpVerifyInputBody:
      additionalProperties: false
      properties:
        code:
          description: Code from the email
          examples:
            - "123456"
          pattern: ^[0-9]{6}$
          type: string
        email:
          description: Email the code was sent to
          examples:
            - jan.kowalski@student.kul.pl
          maxLength: 255
          minLength: 3
          type: string
        university:
          description: University to log in to
          examples:
            - kul
          minLength: 1
          type: string
      required:
        - university
        - email
        - code
      type: object
    Post:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/Author"
        commentsCount:
          format: int64
          type: integer
        content:
          type: string
        createdAt:
          format: date-time
          type: string
        editedAt:
          format: date-time
          type:
            - string
            - "null"
        eventDate:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        likedByMe:
          type: boolean
        likesCount:
          format: int64
          type: integer
        mediaUrls:
          items:
            type: string
          type:
            - array
            - "null"
        savedByMe:
          type: boolean
        tags:
          items:
            type: string
          type:
            - array
            - "null"
        title:
          type: string
        type:
          enum:
            - announcement
            - event
            - question
          type: string
        university:
          description: Target university, or all
          examples:
            - umcs
          type: string
      required:
        - id
        - type
        - university
        - title
        - content
        - tags
        - eventDate
        - mediaUrls
        - author
        - likesCount
        - commentsCount
        - likedByMe
        - savedByMe
        - createdAt
        - editedAt
      type: object
    PostNavigation:
      additionalProperties: false
      properties:
        nextId:
          description: Nearest older post, or null at the end
          format: uuid
          type:
            - string
            - "null"
        previousId:
          description: Nearest newer post, or null at the start
          format: uuid
          type:
            - string
            - "null"
      required:
        - previousId
        - nextId
      type: object
    Preferences:
      additionalProperties: false
      properties:
        birthDate:
          description: Null until set
          examples:
            - "2003-05-17"
          format: date
          type:
            - string
            - "null"
        intent:
          description: Shown on the student's discovery card. Null when unset.
          examples:
            - Looking for a climbing partner
          type:
            - string
            - "null"
        openTo:
          description: Who the student can discover and be discovered as
          items:
            enum:
              - friends
              - studyBuddy
              - dating
            type: string
          type:
            - array
            - "null"
      required:
        - birthDate
        - openTo
        - intent
      type: object
    Profile:
      additionalProperties: false
      properties:
        avatarUrl:
          description: URL of the avatar image, null when the student has none
          type:
            - string
            - "null"
        bannerUrl:
          description: URL of the banner image, null when the student has none
          type:
            - string
            - "null"
        bio:
          description: Plain text, up to 500 characters
          examples:
            - Second-year CS student, into climbing.
          type:
            - string
            - "null"
        createdAt:
          format: date-time
          type: string
        email:
          description: University email, null when USOS did not share it
          examples:
            - jan.kowalski@umcs.pl
          type:
            - string
            - "null"
        firstName:
          examples:
            - Jan
          type:
            - string
            - "null"
        gender:
          description: Set once; null until set. Visible to other students, with no privacy toggle.
          enum:
            - male
            - female
          type:
            - string
            - "null"
        id:
          description: User ID
          format: uuid
          type: string
        interests:
          description: Up to 10 tags
          examples:
            - - climbing
              - go
          items:
            type: string
          type:
            - array
            - "null"
        language:
          description: Interface language; defaults to pl
          enum:
            - en
            - pl
            - uk
            - ru
          type: string
        lastName:
          examples:
            - Kowalski
          type:
            - string
            - "null"
        privacy:
          additionalProperties: false
          description: Which profile fields other students see. A missing setting keeps its current value.
          properties:
            showEmail:
              default: false
              description: Show the university email to other students
              type: boolean
            showFaculty:
              default: true
              description: Show the faculty of each study programme
              type: boolean
            showYear:
              default: true
              description: Show the year of study of each study programme
              type: boolean
          type: object
        programmes:
          description: Study programmes, primary first; empty when the student has none
          items:
            $ref: "#/components/schemas/Programme"
          type:
            - array
            - "null"
        songUrl:
          description: Link to the song the student associates with themselves. Null when unset.
          examples:
            - https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT
          type:
            - string
            - "null"
        universityId:
          examples:
            - umcs
          type: string
      required:
        - id
        - email
        - firstName
        - lastName
        - gender
        - language
        - universityId
        - programmes
        - avatarUrl
        - bannerUrl
        - bio
        - songUrl
        - interests
        - privacy
        - createdAt
      type: object
    ProfileSummary:
      additionalProperties: false
      properties:
        avatarUrl:
          type:
            - string
            - "null"
        firstName:
          examples:
            - Jan
          type:
            - string
            - "null"
        gender:
          description: Null until set; always visible to other students, with no privacy toggle
          enum:
            - male
            - female
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        lastName:
          examples:
            - Kowalski
          type:
            - string
            - "null"
        universityId:
          examples:
            - umcs
          type: string
      required:
        - id
        - firstName
        - lastName
        - gender
        - universityId
        - avatarUrl
      type: object
    Programme:
      additionalProperties: false
      properties:
        faculty:
          examples:
            - Wydział Matematyki, Fizyki i Informatyki
          type: string
        id:
          format: uuid
          type: string
        isPrimary:
          type: boolean
        level:
          enum:
            - first_cycle
            - second_cycle
            - long_cycle
            - third_cycle
            - phd_school
          type:
            - string
            - "null"
        modeOfStudies:
          enum:
            - full_time
            - part_time
          type:
            - string
            - "null"
        programme:
          examples:
            - Informatyka
          type: string
        status:
          enum:
            - active
            - graduated
            - suspended
            - cancelled
          type: string
        yearOfStudy:
          examples:
            - 2
          format: int64
          maximum: 6
          minimum: 1
          type:
            - integer
            - "null"
      required:
        - id
        - faculty
        - programme
        - level
        - modeOfStudies
        - yearOfStudy
        - status
        - isPrimary
      type: object
    ProgrammeRequest:
      additionalProperties: false
      properties:
        faculty:
          maxLength: 255
          minLength: 1
          type: string
        isPrimary:
          description: Making a programme primary clears the flag on the others
          type: boolean
        level:
          enum:
            - first_cycle
            - second_cycle
            - long_cycle
            - third_cycle
            - phd_school
          type: string
        modeOfStudies:
          enum:
            - full_time
            - part_time
          type: string
        programme:
          maxLength: 255
          minLength: 1
          type: string
        status:
          default: active
          enum:
            - active
            - graduated
            - suspended
            - cancelled
          type: string
        yearOfStudy:
          format: int64
          maximum: 6
          minimum: 1
          type: integer
      required:
        - faculty
        - programme
      type: object
    ProposalRequest:
      additionalProperties: false
      properties:
        answer:
          description: 1 to 2000 characters after HTML is stripped
          maxLength: 8000
          minLength: 1
          type: string
        question:
          description: 3 to 200 characters after HTML is stripped
          maxLength: 1000
          minLength: 1
          type: string
      required:
        - question
        - answer
      type: object
    PublicProfile:
      additionalProperties: false
      properties:
        avatarUrl:
          type:
            - string
            - "null"
        bio:
          type:
            - string
            - "null"
        email:
          description: Null unless the student shows it
          type:
            - string
            - "null"
        firstName:
          examples:
            - Jan
          type:
            - string
            - "null"
        gender:
          description: Null until set; always visible to other students, with no privacy toggle
          enum:
            - male
            - female
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        interests:
          items:
            type: string
          type:
            - array
            - "null"
        lastName:
          examples:
            - Kowalski
          type:
            - string
            - "null"
        programmes:
          description: Primary first
          items:
            $ref: "#/components/schemas/PublicProgramme"
          type:
            - array
            - "null"
        songUrl:
          description: Link to the song the student associates with themselves. Null when unset. Always visible, with no privacy toggle.
          type:
            - string
            - "null"
        universityId:
          examples:
            - umcs
          type: string
      required:
        - id
        - email
        - firstName
        - lastName
        - gender
        - universityId
        - avatarUrl
        - bio
        - songUrl
        - interests
        - programmes
      type: object
    PublicProgramme:
      additionalProperties: false
      properties:
        faculty:
          description: Null when the student hides it
          type:
            - string
            - "null"
        isPrimary:
          type: boolean
        level:
          enum:
            - first_cycle
            - second_cycle
            - long_cycle
            - third_cycle
            - phd_school
          type:
            - string
            - "null"
        modeOfStudies:
          enum:
            - full_time
            - part_time
          type:
            - string
            - "null"
        programme:
          examples:
            - Informatyka
          type: string
        status:
          enum:
            - active
            - graduated
            - suspended
            - cancelled
          type: string
        yearOfStudy:
          description: Null when unknown or hidden by the student
          format: int64
          type:
            - integer
            - "null"
      required:
        - faculty
        - programme
        - level
        - modeOfStudies
        - yearOfStudy
        - status
        - isPrimary
      type: object
    Report:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        details:
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        reason:
          enum:
            - spam
            - harassment
            - inappropriate
            - hate_speech
            - other
          type: string
        status:
          enum:
            - pending
            - reviewed
            - dismissed
          type: string
        targetId:
          format: uuid
          type: string
        targetType:
          type: string
          x-extensible-enum:
            - post
            - comment
            - user
            - candidate
      required:
        - id
        - targetType
        - targetId
        - reason
        - details
        - status
        - createdAt
      type: object
    SavePreferencesInputBody:
      additionalProperties: false
      properties:
        birthDate:
          description: Age must be 16 to 100
          examples:
            - "2003-05-17"
          format: date
          type: string
        intent:
          description: Up to 200 characters after HTML is stripped. An empty string clears it.
          maxLength: 1000
          type: string
        openTo:
          description: dating needs an age of at least 18, else returns 400 dating_requires_adult
          items:
            enum:
              - friends
              - studyBuddy
              - dating
            type: string
          maxItems: 3
          type:
            - array
            - "null"
      type: object
    SaveState:
      additionalProperties: false
      properties:
        saved:
          type: boolean
      required:
        - saved
      type: object
    UniversityDTO:
      additionalProperties: false
      properties:
        authMethod:
          description: Authentication method used by the university
          examples:
            - USOS
          type: string
        domains:
          description: Allowed student email domains for OTP authentication
          examples:
            - - student.kul.pl
          items:
            type: string
          type:
            - array
            - "null"
        faculties:
          description: Faculties of the university with their locations
          items:
            $ref: "#/components/schemas/FacultyDTO"
          type:
            - array
            - "null"
        id:
          description: Unique identifier of the university
          examples:
            - umcs
          type: string
        name:
          description: Display name of the university
          examples:
            - Uniwersytet Marii Curie-Skłodowskiej
          type: string
      required:
        - id
        - name
        - authMethod
        - faculties
      type: object
    UpdateCommentInputBody:
      additionalProperties: false
      properties:
        content:
          maxLength: 4000
          type: string
      required:
        - content
      type: object
    UpdateMeInputBody:
      additionalProperties: false
      properties:
        avatarMediaId:
          description: mediaId of an avatar uploaded through createMediaUpload; the previous avatar is deleted
          format: uuid
          type: string
        bannerMediaId:
          description: mediaId of a banner uploaded through createMediaUpload; the previous banner is deleted
          format: uuid
          type: string
        bio:
          description: Plain text; HTML is stripped and the result may be up to 500 characters. An empty string clears it.
          maxLength: 2000
          type: string
        firstName:
          maxLength: 100
          minLength: 1
          type: string
        gender:
          description: "Can be set only once: when a gender is already saved, returns 400 gender_immutable"
          enum:
            - male
            - female
          type: string
        interests:
          description: "Replaces all interests: up to 10 tags of up to 30 characters, duplicates ignored"
          items:
            type: string
          maxItems: 10
          type: array
        language:
          enum:
            - en
            - pl
            - uk
            - ru
          type: string
        lastName:
          maxLength: 100
          minLength: 1
          type: string
        privacy:
          additionalProperties: false
          description: Which profile fields other students see. A missing setting keeps its current value.
          properties:
            showEmail:
              default: false
              description: Show the university email to other students
              type: boolean
            showFaculty:
              default: true
              description: Show the faculty of each study programme
              type: boolean
            showYear:
              default: true
              description: Show the year of study of each study programme
              type: boolean
          type: object
        songUrl:
          description: http or https URL, up to 500 characters. An empty string clears it. Anything else returns 400 invalid_input and leaves the saved link unchanged.
          maxLength: 2000
          type: string
      type: object
    UpdatePostInputBody:
      additionalProperties: false
      properties:
        content:
          maxLength: 20000
          type: string
        eventDate:
          description: Only for event posts
          format: date-time
          type: string
        tags:
          items:
            type: string
          maxItems: 20
          type: array
        title:
          maxLength: 600
          type: string
      type: object
    Upload:
      additionalProperties: false
      properties:
        expiresAt:
          description: When the upload URL stops working
          format: date-time
          type: string
        headers:
          additionalProperties:
            type: string
          description: Headers the PUT must send exactly as given; If-None-Match makes the URL write the file only once
          type: object
        mediaId:
          description: ID to pass to the endpoint that uses the file, e.g. avatarMediaId or bannerMediaId
          format: uuid
          type: string
        uploadUrl:
          description: Presigned URL to PUT the file to, with the headers below
          type: string
      required:
        - mediaId
        - uploadUrl
        - expiresAt
        - headers
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  title: Uniezz API
  version: dev
openapi: 3.1.0
paths:
  /auth/exchange:
    post:
      operationId: exchangeLoginCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSession"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Exchange a one-time login code for a session
      tags:
        - auth
  /auth/otp/request:
    post:
      description: Sends a 6-digit code to the university email. The code is valid for 10 minutes and a new request replaces the previous code.
      operationId: requestOtpCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInputBody"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Gateway
      summary: Email a one-time login code
      tags:
        - auth
  /auth/otp/verify:
    post:
      description: Returns a session. A code allows 5 attempts; after that, or after it expires, request a new one.
      operationId: verifyOtpCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedSession"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Log in with an emailed code
      tags:
        - auth
  /auth/universities:
    get:
      description: Lists every university the app supports, in display order, with how its students log in.
      operationId: getUniversities
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UniversityDTO"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Error
      summary: Get the list of supported universities
      tags:
        - auth
  /auth/usos/callback:
    get:
      description: Called by USOS, not by the apps. Redirects to the app with ?code=<login code> to pass to exchangeLoginCode, or with ?error=<code>. Answers with a JSON error only when the login state is unknown, as there is no app to return to.
      operationId: finishUsosLogin
      parameters:
        - description: Request token, set by USOS
          explode: false
          in: query
          name: oauth_token
          required: true
          schema:
            description: Request token, set by USOS
            minLength: 1
            type: string
        - description: Verifier, set by USOS
          explode: false
          in: query
          name: oauth_verifier
          required: true
          schema:
            description: Verifier, set by USOS
            minLength: 1
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Finish a USOS login
      tags:
        - auth
  /auth/usos/start:
    get:
      description: Redirects to the university's USOS authorization page. Errors after the platform is known are sent to the app as a redirect with ?error=<code>.
      operationId: startUsosLogin
      parameters:
        - description: University to log in to
          explode: false
          in: query
          name: university
          required: true
          schema:
            description: University to log in to
            examples:
              - umcs
            type: string
        - description: App to send the browser back to when the login is done
          explode: false
          in: query
          name: platform
          required: true
          schema:
            description: App to send the browser back to when the login is done
            enum:
              - web
              - mobile
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      summary: Start a USOS login
      tags:
        - auth
  /connections:
    get:
      description: Newest first, paginated by cursor. Students blocked either way are left out.
      operationId: listConnections
      parameters:
        - description: nextCursor from the previous page; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: nextCursor from the previous page; omit for the first page
            maxLength: 512
            type: string
        - description: Maximum number of items in the page
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Maximum number of items in the page
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConnectionsOutputBody"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List the logged-in student's matches
      tags:
        - connections
  /connections/blocks/{id}:
    delete:
      description: Succeeds when there is no such block.
      operationId: unblockStudent
      parameters:
        - description: The blocked student's profile id
          in: path
          name: id
          required: true
          schema:
            description: The blocked student's profile id
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Remove a block
      tags:
        - connections
    put:
      description: "Each student stops seeing the other in discovery, the profile list, the profile, connections, and the feed: posts, comments and the featured list. Blocking twice changes nothing."
      operationId: blockStudent
      parameters:
        - description: The blocked student's profile id
          in: path
          name: id
          required: true
          schema:
            description: The blocked student's profile id
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Block a student
      tags:
        - connections
  /connections/candidates/{id}:
    put:
      description: A like cannot be undone; at most 50 likes per 24 hours. A pass hides the student for 30 days from the latest pass. Mutual likes in the same mode create one connection. Returns 404 when the candidate id belongs to another viewer or has expired, or when the two students can no longer meet in this mode.
      operationId: actOnCandidate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActOnCandidateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Like or pass a discovery card
      tags:
        - connections
  /connections/discover:
    get:
      description: "A deck of up to limit cards, best match first, with no cursor: liked, hidden, blocked and connected students and those passed in the last 30 days are left out, so the next call shows the next cards. Both students must be open to the mode, and dating shows only adults. A card never contains the user id, name, photos, faculty, programme or year; issuing its candidateId is the only write."
      operationId: discoverConnections
      parameters:
        - explode: false
          in: query
          name: mode
          required: true
          schema:
            enum:
              - friends
              - studyBuddy
              - dating
            type: string
        - description: Only students of these universities; repeat the parameter for several
          explode: false
          in: query
          name: university
          schema:
            description: Only students of these universities; repeat the parameter for several
            examples:
              - - umcs
            items:
              type: string
            maxItems: 10
            type:
              - array
              - "null"
        - description: studyBuddy only. Students who hide their faculty never match.
          explode: false
          in: query
          name: faculty
          schema:
            description: studyBuddy only. Students who hide their faculty never match.
            maxLength: 255
            type: string
        - description: studyBuddy only
          explode: false
          in: query
          name: level
          schema:
            description: studyBuddy only
            items:
              enum:
                - first_cycle
                - second_cycle
                - long_cycle
                - third_cycle
                - phd_school
              type: string
            maxItems: 5
            type:
              - array
              - "null"
        - explode: false
          in: query
          name: gender
          schema:
            enum:
              - male
              - female
            type: string
        - description: Only students with at least one interest in common
          explode: false
          in: query
          name: sharedInterests
          schema:
            description: Only students with at least one interest in common
            type: boolean
        - explode: false
          in: query
          name: limit
          schema:
            default: 1
            format: int64
            maximum: 20
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverOutputBody"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Discover anonymous students
      tags:
        - connections
  /connections/me:
    get:
      operationId: getMyConnectionPreferences
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Get what Connections may show about the logged-in student
      tags:
        - connections
    patch:
      description: A missing field keeps its current value. Birth date is used only to compute age.
      operationId: updateMyConnectionPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePreferencesInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Set what Connections may show about the logged-in student
      tags:
        - connections
  /connections/{id}:
    delete:
      operationId: deleteConnection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Remove a match for both students
      tags:
        - connections
  /faq:
    get:
      description: Published entries only, newest first. A proposal or a rejected entry is never returned. An empty FAQ is an empty list.
      operationId: listFaqEntries
      parameters:
        - description: nextCursor from the previous page; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: nextCursor from the previous page; omit for the first page
            maxLength: 512
            type: string
        - description: Maximum number of items in the page
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Maximum number of items in the page
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEntriesOutputBody"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List published FAQ entries
      tags:
        - faq
    post:
      description: Stores the question and answer as published. Only one hardcoded address may call this. Everyone else gets 403.
      operationId: publishFaqEntry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Publish an FAQ entry
      tags:
        - faq
  /faq/proposals:
    get:
      description: The caller's proposals only, newest first, including proposed, published and rejected. Other students' proposals are absent.
      operationId: listMyFaqProposals
      parameters:
        - description: nextCursor from the previous page; omit for the first page
          explode: false
          in: query
          name: cursor
          schema:
            description: nextCursor from the previous page; omit for the first page
            maxLength: 512
            type: string
        - description: Maximum number of items in the page
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Maximum number of items in the page
            format: int64
            maximum: 50
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEntriesOutputBody"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          description: Unprocessable Entity
