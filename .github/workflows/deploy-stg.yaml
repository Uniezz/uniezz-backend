name: Deploy staging

on:
  push:
    branches: ["release/**"]

permissions:
  contents: read

concurrency:
  group: deploy-stg
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yaml

  image:
    name: Image
    needs: test
    uses: ./.github/workflows/image.yaml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy
    needs: image
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit
    with:
      environment: staging
      stack: stg
      api_url: https://api-stg.uniezz.pl

  notify:
    name: Notify
    needs: [test, image, deploy]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deploy-notify.yaml
    secrets: inherit
    permissions:
      contents: read
      actions: read
    with:
      environment: staging
      label: Staging
      workflow: deploy-stg.yaml
      result: ${{ needs.deploy.result }}
