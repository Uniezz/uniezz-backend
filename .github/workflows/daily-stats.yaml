name: Daily stats

# Posts the number of students who finished onboarding on production, with a
# growth chart, to the newcomers topic in Telegram at 20:00 Warsaw time.
# GitHub cron runs in UTC, so both 18:00 and 19:00 UTC are scheduled and only
# the one that is 20:00 in Warsaw (summer or winter time) goes on.

on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  stats:
    name: Post onboarded students
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Keep only the 20:00 Warsaw run
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$(TZ=Europe/Warsaw date +%z)" in
            +0200) want="0 18 * * *" ;;
            *) want="0 19 * * *" ;;
          esac
          if [ "$SCHEDULE" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 20:00 in Warsaw for '$SCHEDULE', skipping"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/daily-stats/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r scripts/daily-stats/requirements.txt

      - name: Install Doppler CLI
        if: steps.gate.outputs.run == 'true'
        uses: dopplerhq/cli-action@v4

      - name: Post stats
        if: steps.gate.outputs.run == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run --only-secrets DATABASE_URL,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,TELEGRAM_THREAD_ID -- \
            python scripts/daily-stats/daily_stats.py
