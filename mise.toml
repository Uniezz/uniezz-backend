[env]
_.file = '.env'

[tools]
go = "1.27.1"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.28.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.13.2"

# DEVELOPMENT TASKS

[tasks.dev]
description = "Run Go API in local development mode"
run = "doppler run -c dev -- go run ./cmd/api"

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.vet]
description = "Run Go vet to check for potential issues"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "doppler run -c dev -- go test -v -race ./..."

[tasks.lint]
description = "Fast cached linting"
run = "golangci-lint run ./..."

[tasks."lint:fix"]
description = "Auto-fix lint and formatting issues"
run = "golangci-lint run --fix ./..."

# DOCKER / INFRASTRUCTURE TASKS

[tasks."db:up"]
description = "Start PostgreSQL container and wait for healthcheck"
run = "doppler run -c dev -- docker compose up -d --wait"

[tasks."db:down"]
description = "Stop PostgreSQL container"
run = "docker compose down"

[tasks."db:logs"]
description = "Follow PostgreSQL container logs"
run = "docker compose logs -f postgres"

[tasks.setup]
description = "Setup dev environment and git hooks"
run = "git config core.hooksPath .githooks"

# DATABASE MIGRATION TASKS
# goose reads GOOSE_DBSTRING from Doppler (a reference to DATABASE_URL), so no
# shell variable expansion is needed — works under cmd.exe on Windows too.
[tasks."migrate:status"]
description = "Show status of all migrations"
env = { GOOSE_DRIVER = "postgres", GOOSE_MIGRATION_DIR = "migrations" }
run = "doppler run -c dev -- goose status"

[tasks."migrate:up"]
description = "Apply all pending migrations"
env = { GOOSE_DRIVER = "postgres", GOOSE_MIGRATION_DIR = "migrations" }
run = "doppler run -c dev -- goose up"

[tasks."migrate:down"]
description = "Roll back the most recent migration"
env = { GOOSE_DRIVER = "postgres", GOOSE_MIGRATION_DIR = "migrations" }
run = "doppler run -c dev -- goose down"

[tasks."migrate:create"]
description = "Create a new SQL migration file (usage: mise run migrate:create <name>)"
usage = 'arg "<name>"'
env = { GOOSE_MIGRATION_DIR = "migrations" }
run = 'goose create {{usage.name}} sql'
