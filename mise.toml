[env]
_.file = '.env'

[tools]
go = "1.27.1"
"github:oasdiff/oasdiff" = "1.33.0"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.28.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.13.2"

# DEVELOPMENT TASKS

# `dev` and `test` take secrets from Doppler; the `:env` variants take them from .env
# instead, for developers without Doppler access. Everything else needs no secrets.
[tasks.dev]
description = "Start PostgreSQL, apply migrations and run the API with hot reload (secrets from Doppler)"
run = "doppler run -c dev -- docker compose up --build --watch"

[tasks."dev:env"]
description = "Same as dev, with secrets from .env instead of Doppler"
run = "docker compose up --build --watch"

[tasks."dev:reset"]
description = "Stop the stack and delete its volumes: the database data and Go caches"
run = "docker compose down --volumes"

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.vet]
description = "Run Go vet to check for potential issues"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "doppler run -c dev -- go test -v -race ./..."

[tasks."test:env"]
description = "Run Go tests (DATABASE_URL from .env)"
run = "go test -v -race ./..."

[tasks.lint]
description = "Fast cached linting"
run = "golangci-lint run ./..."

[tasks.openapi]
description = "Regenerate api/openapi.yaml from the registered operations"
run = "go run ./cmd/openapi -o api/openapi.yaml"


[tasks."lint:fix"]
description = "Auto-fix lint and formatting issues"
run = "golangci-lint run --fix ./..."

# DOCKER / INFRASTRUCTURE TASKS

[tasks."db:up"]
description = "Start only PostgreSQL in the background and wait for its healthcheck"
run = "docker compose up -d --wait postgres"

[tasks."db:down"]
description = "Stop the development stack"
run = "docker compose down"

[tasks."db:logs"]
description = "Follow PostgreSQL container logs"
run = "docker compose logs -f postgres"

[tasks.setup]
description = "Setup dev environment and git hooks"
run = "git config core.hooksPath .githooks"

# DATABASE MIGRATION TASKS
# Run goose in the migrate container of compose.yaml, which starts PostgreSQL first
# and has the connection string built in, so no secrets or host goose are needed.
[tasks."migrate:status"]
description = "Show status of all migrations"
run = "docker compose run --rm migrate goose status"

[tasks."migrate:up"]
description = "Apply all pending migrations"
run = "docker compose run --rm migrate goose up"

[tasks."migrate:down"]
description = "Roll back the most recent migration"
run = "docker compose run --rm migrate goose down"

[tasks."migrate:create"]
description = "Create a new SQL migration file (usage: mise run migrate:create <name>)"
usage = 'arg "<name>"'
env = { GOOSE_MIGRATION_DIR = "migrations" }
run = 'goose create {{usage.name}} sql'
